<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320">
  <defs>
    <!-- Neon glow filters -->
    <filter id="glow1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Gradient for fiber lines -->
    <linearGradient id="fiber1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fiber2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fiber3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0"/>
      <stop offset="40%" stop-color="#8B5CF6" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fiber4" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="480" height="320" fill="#0A0A0B"/>

  <!-- Grid lines - faint -->
  <g opacity="0.06">
    <line x1="80" y1="0" x2="80" y2="320" stroke="#6366F1" stroke-width="0.5"/>
    <line x1="160" y1="0" x2="160" y2="320" stroke="#6366F1" stroke-width="0.5"/>
    <line x1="240" y1="0" x2="240" y2="320" stroke="#6366F1" stroke-width="0.5"/>
    <line x1="320" y1="0" x2="320" y2="320" stroke="#6366F1" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="320" stroke="#6366F1" stroke-width="0.5"/>
    <line x1="0" y1="80" x2="480" y2="80" stroke="#6366F1" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="480" y2="160" stroke="#6366F1" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="480" y2="240" stroke="#6366F1" stroke-width="0.5"/>
  </g>

  <!-- Nodes - tiny dots at intersections -->
  <g fill="#6366F1" opacity="0.2">
    <circle cx="80" cy="80" r="2"/>
    <circle cx="80" cy="160" r="2"/>
    <circle cx="80" cy="240" r="2"/>
    <circle cx="160" cy="80" r="2"/>
    <circle cx="160" cy="160" r="2"/>
    <circle cx="160" cy="240" r="2"/>
    <circle cx="240" cy="80" r="2"/>
    <circle cx="240" cy="160" r="2"/>
    <circle cx="240" cy="240" r="2"/>
    <circle cx="320" cy="80" r="2"/>
    <circle cx="320" cy="160" r="2"/>
    <circle cx="320" cy="240" r="2"/>
    <circle cx="400" cy="80" r="2"/>
    <circle cx="400" cy="160" r="2"/>
    <circle cx="400" cy="240" r="2"/>
  </g>

  <!-- Active nodes - brighter -->
  <g filter="url(#glow2)" fill="#6366F1" opacity="0.5">
    <circle cx="160" cy="160" r="2.5"/>
    <circle cx="240" cy="80" r="2.5"/>
    <circle cx="320" cy="240" r="2.5"/>
    <circle cx="80" cy="240" r="2"/>
    <circle cx="400" cy="80" r="2"/>
  </g>

  <!-- Fiber optic neon lines -->
  <!-- Horizontal wave -->
  <path d="M40 100 Q120 80 160 100 T280 100 T400 100" stroke="url(#fiber1)" stroke-width="1.2" fill="none" filter="url(#glow1)" opacity="0.7"/>
  <!-- Vertical wave -->
  <path d="M200 40 Q220 120 200 160 T200 280" stroke="url(#fiber2)" stroke-width="1.2" fill="none" filter="url(#glow1)" opacity="0.7"/>
  <!-- Diagonal connections -->
  <path d="M80 160 L160 80" stroke="url(#fiber3)" stroke-width="1" fill="none" filter="url(#glow2)" opacity="0.5"/>
  <path d="M240 240 L320 160" stroke="url(#fiber3)" stroke-width="1" fill="none" filter="url(#glow2)" opacity="0.5"/>
  <path d="M160 240 L320 80" stroke="url(#fiber4)" stroke-width="0.8" fill="none" filter="url(#glow2)" opacity="0.35"/>
  <path d="M80 80 L240 240" stroke="url(#fiber4)" stroke-width="0.8" fill="none" filter="url(#glow2)" opacity="0.35"/>

  <!-- Center burst node -->
  <circle cx="200" cy="160" r="1.5" fill="#6366F1" opacity="0" filter="url(#glow1)"/>
  <circle cx="200" cy="160" r="3" fill="none" stroke="#6366F1" stroke-width="0.5" opacity="0.3" filter="url(#glow2)"/>

  <!-- Tiny sparks -->
  <g fill="#3B82F6" filter="url(#glow2)" opacity="0.4">
    <circle cx="120" cy="140" r="1"/>
    <circle cx="280" cy="100" r="1"/>
    <circle cx="360" cy="180" r="1"/>
    <circle cx="140" cy="200" r="1"/>
    <circle cx="300" cy="220" r="1"/>
  </g>
</svg>
